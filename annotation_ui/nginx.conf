server {
    listen 3721;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # CSV/JSON imports are uploaded through this proxy. The backend enforces
    # the real limit (MAX_UPLOAD_MB); nginx only needs a ceiling above it
    # instead of its 1 MB default.
    client_max_body_size 100m;

    # API routes → backend service.  The SPA is built with API_URL=/api, so
    # every API call goes through this prefix; the trailing slash in
    # proxy_pass strips "/api" before forwarding, so backend routes are
    # unchanged.  Page routes such as /projects/:id or /admin are never
    # proxied and fall through to index.html below.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite instead of appending: the backend trusts this header for
        # its per-client auth rate limit, so clients must not be able to
        # inject their own value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React Router — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
